<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metafunga — Species Database</title>
<style>
  :root {
    --bg: #fafaf8;
    --card: #fff;
    --border: #e8e4df;
    --text: #2d2a25;
    --muted: #8a8278;
    --accent: #7c5c2e;
    --easy: #d1fae5; --easy-t: #065f46;
    --medium: #fef3c7; --medium-t: #92400e;
    --hard: #fee2e2; --hard-t: #991b1b;
    --insane: #ede9fe; --insane-t: #4c1d95;
    --choice: #bbf7d0; --choice-t: #14532d;
    --edible: #d1fae5; --edible-t: #065f46;
    --inedible: #f1f0ee; --inedible-t: #57534e;
    --toxic: #fed7aa; --toxic-t: #9a3412;
    --deadly: #fca5a5; --deadly-t: #7f1d1d;
    --psychoactive: #e9d5ff; --psychoactive-t: #581c87;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
  header p { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .controls { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 9; }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-row input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
  .search-row input:focus { border-color: var(--accent); }
  .count { font-size: 11px; color: var(--muted); white-space: nowrap; padding-bottom: 2px; }

  .filter-row { display: flex; gap-x: 6px; gap-y: 6px; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
  .chip { border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--muted); transition: all 0.15s; user-select: none; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--bg); }
  th { padding: 8px 10px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 3px; opacity: 0.4; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }

  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #faf8f5; }

  .col-img { width: 44px; }
  .col-img img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; background: var(--border); display: block; }
  .col-img .no-img { width: 40px; height: 40px; border-radius: 8px; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; }

  .species-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
  .species-sci { font-size: 11px; color: var(--muted); font-style: italic; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; }
  .badge.easy    { background: var(--easy);    color: var(--easy-t); }
  .badge.medium  { background: var(--medium);  color: var(--medium-t); }
  .badge.hard    { background: var(--hard);    color: var(--hard-t); }
  .badge.insane  { background: var(--insane);  color: var(--insane-t); }
  .badge.choice       { background: var(--choice);       color: var(--choice-t); }
  .badge.edible       { background: var(--edible);       color: var(--edible-t); }
  .badge.inedible     { background: var(--inedible);     color: var(--inedible-t); }
  .badge.toxic        { background: var(--toxic);        color: var(--toxic-t); }
  .badge.deadly       { background: var(--deadly);       color: var(--deadly-t); }
  .badge.psychoactive { background: var(--psychoactive); color: var(--psychoactive-t); }

  .bar-cell { display: flex; align-items: center; gap: 5px; }
  .bar { height: 5px; border-radius: 3px; background: var(--border); width: 40px; flex-shrink: 0; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-val { font-size: 11px; color: var(--muted); min-width: 22px; }

  .ecology { font-size: 10px; color: var(--muted); }

  @media (max-width: 480px) {
    .col-rarity, .col-ecology { display: none; }
    td, th { padding: 7px 8px; }
  }
  @media (max-width: 360px) {
    .col-fame { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🍄 Metafunga — Species Database</h1>
  <p id="subtitle">134 species</p>
</header>

<div class="controls">
  <div class="search-row">
    <input type="search" id="search" placeholder="Search species…" autocomplete="off" autocorrect="off" spellcheck="false">
    <span class="count" id="count"></span>
  </div>
  <div class="filter-row" id="filters"></div>
</div>

<div style="overflow-x:auto">
<table id="table">
  <thead>
    <tr>
      <th class="col-img"></th>
      <th data-col="commonName">Name <span class="sort-arrow">↕</span></th>
      <th data-col="difficulty">Diff <span class="sort-arrow">↕</span></th>
      <th data-col="edibility">Edibility <span class="sort-arrow">↕</span></th>
      <th data-col="fame" class="col-fame">Fame <span class="sort-arrow">↕</span></th>
      <th data-col="rarity" class="col-rarity">Rarity <span class="sort-arrow">↕</span></th>
      <th data-col="ecology" class="col-ecology">Ecology <span class="sort-arrow">↕</span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

"parasitic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Chalara_ash_dieback_-_symptoms_-_39.jpg/500px-Chalara_ash_dieback_-_symptoms_-_39.jpg"},{"id":"batrachochytrium-dendrobatidis","commonName":"Chytrid Fungus","scientificName":"Batrachochytrium dendrobatidis","difficulty":"medium","rarity":40,"fame":60,"edibility":"inedible","ecology":"parasitic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Batrachochytrium_dendrobatidis.jpg/500px-Batrachochytrium_dendrobatidis.jpg"},{"id":"allomyces-reticulatus","commonName":"Water Mold","scientificName":"Allomyces reticulatus","difficulty":"insane","rarity":75,"fame":10,"edibility":"inedible","ecology":"saprotrophic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Allomyces.jpg/400px-Allomyces.jpg"},{"id":"gyromitra-caroliniana","commonName":"Carolina False Morel","scientificName":"Gyromitra caroliniana","difficulty":"hard","rarity":35,"fame":40,"edibility":"toxic","ecology":"saprotrophic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Gyromitra_caroliniana_44297.jpg/500px-Gyromitra_caroliniana_44297.jpg"},{"id":"laetiporus-cincinnatus","commonName":"White-Pored Chicken of the Woods","scientificName":"Laetiporus cincinnatus","difficulty":"medium","rarity":30,"fame":55,"edibility":"edible","ecology":"parasitic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Laetiporus_sulphureus_JPG01.jpg/500px-Laetiporus_sulphureus_JPG01.jpg"},{"id":"morchella-americana","commonName":"American Morel","scientificName":"Morchella americana","difficulty":"easy","rarity":20,"fame":80,"edibility":"choice","ecology":"saprotrophic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Morchella_americana_closer.JPG/500px-Morchella_americana_closer.JPG"},{"id":"cantharellus-cinnabarinus","commonName":"Cinnabar Chanterelle","scientificName":"Cantharellus cinnabarinus","difficulty":"medium","rarity":30,"fame":45,"edibility":"edible","ecology":"mycorrhizal","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Cantharellus_cinnabarinus.jpg/500px-Cantharellus_cinnabarinus.jpg"},{"id":"imleria-badia","commonName":"Bay Bolete","scientificName":"Imleria badia","difficulty":"hard","rarity":25,"fame":35,"edibility":"edible","ecology":"mycorrhizal","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Boletus_badius_JPG1.jpg/500px-Boletus_badius_JPG1.jpg"},{"id":"ganoderma-tsugae","commonName":"Hemlock Varnish Shelf","scientificName":"Ganoderma tsugae","difficulty":"medium","rarity":30,"fame":55,"edibility":"inedible","ecology":"parasitic","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Ganoderma_tsugae.jpg/500px-Ganoderma_tsugae.jpg"},{"id":"tylopilus-felleus","commonName":"Bitter Bolete","scientificName":"Tylopilus felleus","difficulty":"hard","rarity":25,"fame":40,"edibility":"inedible","ecology":"mycorrhizal","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/2006-09-14_Tylopilus_felleus_crop.jpg/500px-2006-09-14_Tylopilus_felleus_crop.jpg"},{"id":"laccaria-amethystina","commonName":"Amethyst Deceiver","scientificName":"Laccaria amethystina","difficulty":"medium","rarity":25,"fame":50,"edibility":"edible","ecology":"mycorrhizal","imageUrl":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Laccaria_amethystina_LC0370.jpg/500px-Laccaria_amethystina_LC0370.jpg"}];

const DIFF_ORDER = {easy:0, medium:1, hard:2, insane:3};
const EDIB_ORDER = {choice:0, edible:1, inedible:2, psychoactive:3, toxic:4, deadly:5};
const ECOL_ICON = {mycorrhizal:'🌲', saprotrophic:'🍂', parasitic:'⚠️'};

let sortCol = 'fame', sortDir = -1;
let activeFilters = { difficulty: null, edibility: null, ecology: null };
let query = '';

function bar(val, color) {
  return `<div class="bar-cell"><div class="bar"><div class="bar-fill" style="width:${val}%;background:${color}"></div></div><span class="bar-val">${val}</span></div>`;
}

function render() {
  let rows = DATA.filter(f => {
    if (activeFilters.difficulty && f.difficulty !== activeFilters.difficulty) return false;
    if (activeFilters.edibility && f.edibility !== activeFilters.edibility) return false;
    if (activeFilters.ecology && f.ecology !== activeFilters.ecology) return false;
    if (query) {
      const q = query.toLowerCase();
      return f.commonName.toLowerCase().includes(q) || f.scientificName.toLowerCase().includes(q);
    }
    return true;
  });

  rows.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'difficulty') { av = DIFF_ORDER[av]; bv = DIFF_ORDER[bv]; }
    if (sortCol === 'edibility') { av = EDIB_ORDER[av]; bv = EDIB_ORDER[bv]; }
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });

  document.getElementById('count').textContent = `${rows.length} of ${DATA.length}`;

  document.getElementById('tbody').innerHTML = rows.map(f => `
    <tr>
      <td class="col-img">
        ${f.imageUrl ? `<img src="${f.imageUrl}" alt="" loading="lazy">` : `<div class="no-img">🍄</div>`}
      </td>
      <td>
        <div class="species-name">${f.commonName}</div>
        <div class="species-sci">${f.scientificName}</div>
      </td>
      <td><span class="badge ${f.difficulty}">${f.difficulty}</span></td>
      <td><span class="badge ${f.edibility}">${f.edibility}</span></td>
      <td class="col-fame">${bar(f.fame, '#d97706')}</td>
      <td class="col-rarity">${bar(f.rarity, '#6b7280')}</td>
      <td class="col-ecology ecology">${ECOL_ICON[f.ecology] || ''} ${f.ecology}</td>
    </tr>
  `).join('');
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  const groups = [
    { key: 'difficulty', values: ['easy','medium','hard','insane'] },
    { key: 'edibility', values: ['choice','edible','inedible','toxic','deadly','psychoactive'] },
    { key: 'ecology', values: ['mycorrhizal','saprotrophic','parasitic'] },
  ];
  groups.forEach(({ key, values }) => {
    values.forEach(v => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = v;
      chip.dataset.key = key;
      chip.dataset.val = v;
      chip.onclick = () => {
        activeFilters[key] = activeFilters[key] === v ? null : v;
        document.querySelectorAll(`.chip[data-key="${key}"]`).forEach(c => {
          c.classList.toggle('active', c.dataset.val === activeFilters[key]);
        });
        render();
      };
      wrap.appendChild(chip);
    });
    // spacer between groups
    const sep = document.createElement('span');
    sep.style.cssText = 'width:1px;height:20px;background:var(--border);display:inline-block;margin:0 2px;align-self:center';
    wrap.appendChild(sep);
  });
}

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortDir *= -1; }
    else { sortCol = col; sortDir = col === 'commonName' || col === 'difficulty' || col === 'edibility' || col === 'ecology' ? 1 : -1; }
    document.querySelectorAll('th[data-col]').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim();
  render();
});

// mark initial sort column
document.querySelector(`th[data-col="fame"]`).classList.add('sorted');
document.querySelector(`th[data-col="fame"] .sort-arrow`).textContent = '↓';

buildFilters();
render();
</script>
